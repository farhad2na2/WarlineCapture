<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Runtime Lifecycle</title>
  <desc id="desc">Runtime lifecycle diagram from menu startup through loading, match, result popup, and return to main menu.</desc>
  <defs>
    <style>
      .bg { fill: #07100d; }
      .title { fill: #f0e6b6; font: 700 36px Arial, sans-serif; }
      .subtitle { fill: #b9c8b0; font: 18px Arial, sans-serif; }
      .lane { fill: #0d1713; stroke: #30483d; stroke-width: 2; rx: 16; }
      .label { fill: #eef4df; font: 700 19px Arial, sans-serif; }
      .h { fill: #f0e6b6; font: 700 22px Arial, sans-serif; }
      .small { fill: #cad7c1; font: 15px Arial, sans-serif; }
      .node { fill: #16231d; stroke: #6c9f78; stroke-width: 2; rx: 12; }
      .nodeBlue { fill: #142230; stroke: #69a9ca; stroke-width: 2; rx: 12; }
      .nodeGold { fill: #251f13; stroke: #c7a84f; stroke-width: 2; rx: 12; }
      .nodePink { fill: #251722; stroke: #a86e9b; stroke-width: 2; rx: 12; }
      .arrow { stroke: #d7bf63; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .arrowBlue { stroke: #69a9ca; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #7fbb7a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrowGold" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#d7bf63"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#69a9ca"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#7fbb7a"/></marker>
  </defs>

  <rect class="bg" width="1600" height="960"/>
  <text class="title" x="56" y="64">Runtime Lifecycle</text>
  <text class="subtitle" x="58" y="96">Startup, route transitions, match entry, result popup, and return flow through split bootstraps and shell ECS requests.</text>

  <rect class="lane" x="60" y="140" width="1480" height="130"/>
  <text class="h" x="90" y="183">Persistent App / Menu Scene</text>
  <rect class="nodeGold" x="370" y="165" width="240" height="78"/>
  <text class="label" x="395" y="198">MenuBootstrapView</text>
  <text class="small" x="395" y="224">Serialized references</text>
  <rect class="node" x="720" y="165" width="260" height="78"/>
  <text class="label" x="745" y="198">MenuBootstrapSystem</text>
  <text class="small" x="745" y="224">App lifetime and shell</text>
  <rect class="nodePink" x="1090" y="165" width="260" height="78"/>
  <text class="label" x="1115" y="198">Main Menu Route</text>
  <text class="small" x="1115" y="224">Header + regions visible</text>

  <rect class="lane" x="60" y="315" width="1480" height="130"/>
  <text class="h" x="90" y="358">UI Shell Transitions</text>
  <rect class="nodePink" x="240" y="340" width="260" height="78"/>
  <text class="label" x="265" y="373">Deploy Pressed</text>
  <text class="small" x="265" y="399">Route request</text>
  <rect class="nodePink" x="620" y="340" width="280" height="78"/>
  <text class="label" x="645" y="373">Loading Overlay</text>
  <text class="small" x="645" y="399">Always above screens/popups</text>
  <rect class="nodePink" x="1020" y="340" width="280" height="78"/>
  <text class="label" x="1045" y="373">Shell Exit</text>
  <text class="small" x="1045" y="399">Header/regions animate out</text>

  <rect class="lane" x="60" y="490" width="1480" height="150"/>
  <text class="h" x="90" y="533">Match Scene Lifetime</text>
  <rect class="nodeGold" x="240" y="525" width="260" height="78"/>
  <text class="label" x="265" y="558">MatchSceneView</text>
  <text class="small" x="265" y="584">Raw scene references</text>
  <rect class="node" x="620" y="525" width="280" height="78"/>
  <text class="label" x="645" y="558">MatchBootstrapSystem</text>
  <text class="small" x="645" y="584">Scene wiring and startup only</text>
  <rect class="nodeBlue" x="1020" y="525" width="280" height="78"/>
  <text class="label" x="1045" y="558">Match Runtime</text>
  <text class="small" x="1045" y="584">ISystem gameplay + managed edges</text>

  <rect class="lane" x="60" y="685" width="1480" height="150"/>
  <text class="h" x="90" y="728">Result And Return</text>
  <rect class="nodePink" x="240" y="720" width="260" height="78"/>
  <text class="label" x="265" y="753">Result Popup</text>
  <text class="small" x="265" y="779">Scale in/out at center</text>
  <rect class="nodePink" x="620" y="720" width="280" height="78"/>
  <text class="label" x="645" y="753">Loading Overlay</text>
  <text class="small" x="645" y="779">Return transition</text>
  <rect class="nodePink" x="1020" y="720" width="280" height="78"/>
  <text class="label" x="1045" y="753">Main Menu Route</text>
  <text class="small" x="1045" y="779">Shell re-enters in order</text>

  <path class="arrow" d="M610 204 H720"/>
  <path class="arrow" d="M980 204 H1090"/>
  <path class="arrowBlue" d="M1220 243 C1220 300 370 300 370 340"/>
  <path class="arrowBlue" d="M500 379 H620"/>
  <path class="arrowBlue" d="M900 379 H1020"/>
  <path class="arrowGreen" d="M1160 418 C1160 470 370 470 370 525"/>
  <path class="arrow" d="M500 564 H620"/>
  <path class="arrow" d="M900 564 H1020"/>
  <path class="arrowBlue" d="M1160 603 C1160 665 370 665 370 720"/>
  <path class="arrowBlue" d="M500 759 H620"/>
  <path class="arrowBlue" d="M900 759 H1020"/>
  <path class="arrowGreen" d="M1160 720 C1450 640 1450 285 1220 243"/>

  <text class="small" x="90" y="900">Rule: route changes flow through shell requests/read models; content swaps preserve the header except match HUD. Loading overlay has highest screen priority. Do not restore a broad GameBootstrap.</text>
</svg>
