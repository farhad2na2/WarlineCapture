<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920">
  <defs>
    <style>
      .bg { fill:#101821; }
      .panel { fill:#182432; stroke:#60758a; stroke-width:3; }
      .map { fill:#253441; stroke:#b7d4ee; stroke-width:5; }
      .grid { stroke:#516274; stroke-width:1.5; opacity:.58; }
      .title { fill:#edf7ff; font:700 34px Arial, sans-serif; }
      .subtitle { fill:#cbd8e6; font:500 20px Arial, sans-serif; }
      .label { fill:#f2fbff; font:700 22px Arial, sans-serif; }
      .small { fill:#d7e5f1; font:600 17px Arial, sans-serif; }
      .tiny { fill:#e0edf7; font:600 13px Arial, sans-serif; }
      .road { fill:#d3bc72; stroke:#f1dfa3; stroke-width:3; }
      .street { fill:#af9863; stroke:#e4cd91; stroke-width:2; }
      .highway { fill:#464944; stroke:#d7be74; stroke-width:4; }
      .wall { fill:none; stroke:#d9d2be; stroke-width:10; stroke-linecap:square; stroke-linejoin:round; }
      .city { fill:#719fc1; stroke:#d9f0ff; stroke-width:4; }
      .market { fill:#5db187; stroke:#d8ffe8; stroke-width:4; }
      .base { fill:#bd8943; stroke:#ffe0a0; stroke-width:4; }
      .command { fill:#cf6650; stroke:#ffd0c4; stroke-width:4; }
      .vehicle { fill:#758f60; stroke:#dff1c9; stroke-width:4; }
      .runway { fill:#747f8d; stroke:#dce4ef; stroke-width:4; }
      .fuel { fill:#9270b8; stroke:#e4d2ff; stroke-width:4; }
      .blocked { fill:#66533b; stroke:#c4a879; stroke-width:3; opacity:.9; }
      .open { fill:#596c4c; stroke:#bed1a9; stroke-width:3; opacity:.68; }
      .objective { fill:none; stroke:#ffdf5d; stroke-width:5; stroke-dasharray:14 9; }
      .spawnBlue { fill:#2f72f1; stroke:#c8dcff; stroke-width:4; }
      .spawnRed { fill:#c93f3f; stroke:#ffd0d0; stroke-width:4; }
      .arrow { stroke:#ffffff; stroke-width:5; fill:none; marker-end:url(#arrowHead); opacity:.92; }
    </style>
    <marker id="arrowHead" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect class="bg" width="1920" height="1920"/>
  <text class="title" x="90" y="78">GC09 2048 x 2048 RTS Blueprint - Full Map Review</text>
  <text class="subtitle" x="90" y="116">Corrected review render: the full city, highway, and right-side military base are visible in one image.</text>

